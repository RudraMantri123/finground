<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinGround — grounded answers over SEC filings</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --fg:#e6e9ef; --muted:#9aa4b2;
          --accent:#5b9bff; --good:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; }
  textarea { width:100%; min-height:70px; resize:vertical; background:#0c0e12; color:var(--fg);
             border:1px solid var(--border); border-radius:8px; padding:12px; font-size:1rem; }
  .row { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  input[type=text]{ background:#0c0e12; color:var(--fg); border:1px solid var(--border);
                    border-radius:8px; padding:9px 12px; font-size:0.9rem; }
  button { background:var(--accent); color:#04122e; border:0; border-radius:8px; padding:10px 18px;
           font-weight:600; font-size:0.95rem; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
  .examples { margin-top:14px; font-size:0.85rem; color:var(--muted); }
  .examples a { color:var(--accent); cursor:pointer; text-decoration:none; margin-right:14px; }
  #out { margin-top:22px; display:none; }
  .answer { white-space:pre-wrap; }
  .badge { display:inline-block; font-size:0.72rem; padding:2px 8px; border-radius:20px; font-weight:600; }
  .badge.answered { background:rgba(63,185,80,.15); color:var(--good); border:1px solid rgba(63,185,80,.4); }
  .badge.refused  { background:rgba(210,153,34,.15); color:var(--warn); border:1px solid rgba(210,153,34,.4); }
  .meta { color:var(--muted); font-size:0.8rem; margin:8px 0 0; }
  .cite { border-left:3px solid var(--accent); background:#0c0e12; border-radius:0 8px 8px 0;
          padding:10px 12px; margin:10px 0; font-size:0.85rem; }
  .cite .prov { color:var(--accent); font-weight:600; margin-bottom:4px; }
  .cite .txt { color:var(--muted); max-height:110px; overflow:auto; }
  .err { color:#f85149; }
  code { background:#0c0e12; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FinGround</h1>
  <p class="sub">Ask a question about a 10-K. Answers are grounded in retrieved excerpts with inline
     <code>[C#]</code> citations — and the system abstains when the filings don't support an answer.</p>

  <div class="card">
    <textarea id="q" placeholder="e.g. What are Apple's main supply-chain risk factors?"></textarea>
    <div class="row">
      <button id="ask" onclick="ask()">Ask</button>
      <label style="font-size:.85rem;color:var(--muted)">model
        <input type="text" id="model" placeholder="(server default)" size="22" />
      </label>
    </div>
    <div class="examples">
      Try:
      <a onclick="setQ('What are Apple’s main supply-chain risk factors?')">Apple supply-chain risks</a>
      <a onclick="setQ('How does NVIDIA describe its data center business?')">NVIDIA data center</a>
      <a onclick="setQ('What is the boiling point of water?')">an out-of-scope question</a>
    </div>
  </div>

  <div id="out" class="card">
    <span id="verdict"></span>
    <p id="answer" class="answer"></p>
    <p id="meta" class="meta"></p>
    <div id="cites"></div>
  </div>
</div>

<script>
function setQ(t){ document.getElementById('q').value = t; }

async function ask(){
  const q = document.getElementById('q').value.trim();
  if (q.length < 3) return;
  const model = document.getElementById('model').value.trim() || null;
  const btn = document.getElementById('ask');
  const out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'Thinking…'; out.style.display = 'block';
  document.getElementById('verdict').innerHTML = '';
  document.getElementById('answer').textContent = '';
  document.getElementById('meta').textContent = '';
  document.getElementById('cites').innerHTML = '';
  try {
    const res = await fetch('/query', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, model })
    });
    const data = await res.json();
    if (!res.ok || data.error){
      document.getElementById('answer').innerHTML =
        '<span class="err">'+(data.error || ('HTTP '+res.status))+'</span>';
      return;
    }
    const v = document.getElementById('verdict');
    v.innerHTML = data.abstained
      ? '<span class="badge refused">ABSTAINED</span>'
      : '<span class="badge answered">ANSWERED</span>';
    document.getElementById('answer').textContent = data.answer;
    const cost = (data.cost_usd != null) ? (' · $'+data.cost_usd.toFixed(5)) : '';
    document.getElementById('meta').textContent =
      `${data.model} · evidence(dense sim) ${data.best_dense_sim.toFixed(3)} · `
      + `${data.latency_s.toFixed(2)}s${data.cached ? ' (cached)' : ''}${cost}`;
    const box = document.getElementById('cites');
    (data.citations || []).forEach(c => {
      const d = document.createElement('div');
      d.className = 'cite';
      d.innerHTML = `<div class="prov">[${c.label}] ${c.provenance}</div>`
                  + `<div class="txt">${c.text.replace(/</g,'&lt;')}</div>`;
      box.appendChild(d);
    });
  } catch(e){
    document.getElementById('answer').innerHTML = '<span class="err">'+e+'</span>';
  } finally {
    btn.disabled = false; btn.textContent = 'Ask';
  }
}
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask();
});
</script>
</body>
</html>
